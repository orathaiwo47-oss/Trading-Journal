const TODAY = new Date().toISOString().slice(0, 10);
const num = (v) => (v === "" || v == null || isNaN(Number(v)) ? null : Number(v));
function lotAgg(lots) {
  const L = lots || [];
  const buys = L.filter((x) => x.side === "buy"), sells = L.filter((x) => x.side === "sell");
  const sh = (a) => a.reduce((s, x) => s + Number(x.shares || 0), 0);
  const val = (a) => a.reduce((s, x) => s + Number(x.shares || 0) * Number(x.price || 0), 0);
  const buyShares = sh(buys), buyCost = val(buys), sellShares = sh(sells), sellValue = val(sells);
  const avgBuy = buyShares ? buyCost / buyShares : null;
  const avgSell = sellShares ? sellValue / sellShares : null;
  const realized = (avgBuy != null && avgSell != null) ? (avgSell - avgBuy) * Math.min(buyShares, sellShares) : null;
  return { count: L.length, buyShares, buyCost, avgBuy, sellShares, sellValue, avgSell, realized, heldShares: buyShares - sellShares };
}
const effBuy = (t) => { const a = lotAgg(t.lots); return a.avgBuy != null ? a.avgBuy : num(t.actualEntry); };
const effSell = (t) => { const a = lotAgg(t.lots); return a.avgSell != null ? a.avgSell : num(t.sellPrice); };
const isClosed = (t) => effSell(t) != null && effBuy(t) != null;
const profit = (t) => (isClosed(t) ? (effSell(t) - effBuy(t)) / effBuy(t) : null);
const isFomo = (t) => { const b = effBuy(t); return b != null && num(t.targetEntry) != null && b > num(t.targetEntry); };
const holdDays = (t) => {
  if (!t.entryDate || !t.sellDate) return null;
  const d = (new Date(t.sellDate) - new Date(t.entryDate)) / 86400000;
  return isNaN(d) ? null : Math.round(d);
};

function buildCSV(trades) {
  const cols = [
    ["วันที่เข้า", "entryDate"], ["หุ้น", "ticker"], ["กลุ่ม", "sector"], ["เกม", "game"],
    ["Fair value", "fairValue"], ["ราคาเป้า", "targetEntry"], ["ราคาเข้า", "actualEntry"],
    ["FOMO", (t) => (isFomo(t) ? "ใช่" : "")],
    ["วันที่ขาย", "sellDate"], ["ราคาขาย", "sellPrice"],
    ["หุ้นซื้อ", (t) => lotAgg(t.lots).buyShares || ""],
    ["เงินลงทุน(บาท)", (t) => { const a = lotAgg(t.lots); return a.buyCost ? Math.round(a.buyCost) : ""; }],
    ["หุ้นขาย", (t) => lotAgg(t.lots).sellShares || ""],
    ["มูลค่าขาย(บาท)", (t) => { const a = lotAgg(t.lots); return a.sellValue ? Math.round(a.sellValue) : ""; }],
    ["กำไร(บาท)", (t) => { const a = lotAgg(t.lots); return a.realized != null ? Math.round(a.realized) : ""; }],
    ["กำไร%", (t) => (profit(t) != null ? (profit(t) * 100).toFixed(1) : "")],
    ["ระยะถือ(วัน)", (t) => (holdDays(t) == null ? "" : holdDays(t))],
    ["ขายเพราะ", "sellReason"], ["ขึ้นตามคาด", "rose"], ["ฝีมือ/โชค", "processLuck"],
    ["Thesis", "thesis"], ["บทเรียน", "lesson"],
  ];
  const esc = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const head = cols.map((c) => esc(c[0])).join(",");
  const rows = trades.map((t) => cols.map((c) => esc(typeof c[1] === "function" ? c[1](t) : t[c[1]])).join(","));
  return [head, ...rows].join("\n");
}

    setLoading(false);

  function persist(next) { setTrades(next); try { localStorage.setItem("trades", JSON.stringify(next)); } catch (e) {} }
  function persistPrices(next) { setPrices(next); try { localStorage.setItem("prices", JSON.stringify(next)); } catch (e) {} }

    const next = exists ? trades.map((t) => (t.id === draft.id ? draft : t)) : [draft, ...trades];
    persist(next); setDraft(null); setView("list");
  }
  function remove() { persist(trades.filter((t) => t.id !== draft.id)); setDraft(null); setView("list"); }

function GraphView({ trades, prices, sel, setSel, onAdd, onDelete, onExample }) {
  const tickers = Array.from(new Set([...trades.map((t) => t.ticker).filter(Boolean), ...Object.keys(prices)]));
  const active = sel && tickers.includes(sel) ? sel : tickers[0];
  const [nd, setNd] = useState(TODAY);
  const [np, setNp] = useState("");

  if (tickers.length === 0) {
    return (
      <div className="wrap slidein">
        <div className="empty">
          <h3>ยังไม่มีหุ้นให้ติดตาม</h3>
          <p>บันทึกดีลสักตัวก่อน แล้วกลับมากรอกราคาที่เห็นเป็นจุดๆ<br />แอปจะวาดเส้นเทรนด์พร้อมจุดซื้อ-ขายให้</p>
          <button className="link" onClick={onExample}>ดูตัวอย่าง RATCH</button>
        </div>
      </div>
    );
  }

  const tr = trades.filter((t) => t.ticker === active);
  const manual = (prices[active] || []).map((x) => ({ t: +new Date(x.d), p: Number(x.p), d: x.d }));
  const byDate = {};
  tr.forEach((t) => {
    if (t.entryDate && effBuy(t) != null) byDate[t.entryDate] = { t: +new Date(t.entryDate), p: effBuy(t), d: t.entryDate };
    if (t.sellDate && effSell(t) != null) byDate[t.sellDate] = { t: +new Date(t.sellDate), p: effSell(t), d: t.sellDate };
  });
  manual.forEach((o) => { byDate[o.d] = o; });
  const linePts = Object.values(byDate).sort((a, b) => a.t - b.t);
  const markers = [];
  tr.forEach((t) => {
    if (t.entryDate && effBuy(t) != null) markers.push({ t: +new Date(t.entryDate), p: effBuy(t), kind: "buy" });
    if (t.sellDate && effSell(t) != null) markers.push({ t: +new Date(t.sellDate), p: effSell(t), kind: "sell" });
  });
  const fairs = Array.from(new Set(tr.map((t) => num(t.fairValue)).filter((v) => v != null)));
  const sortedManual = [...manual].sort((a, b) => b.t - a.t);

  return (
    <div className="wrap slidein">
      <div className="chips">
        {tickers.map((tk) => <button key={tk} className={"tchip" + (tk === active ? " on" : "")} onClick={() => setSel(tk)}>{tk}</button>)}
      </div>
      <div className="chartcard">
        <Chart linePts={linePts} markers={markers} fairs={fairs} />
        <div className="legend">
          <span><svg width="14" height="14"><polygon points="7,2 12,11 2,11" fill="var(--green)" /></svg> ซื้อ</span>
          <span><svg width="14" height="14"><polygon points="2,3 12,3 7,12" fill="var(--red)" /></svg> ขาย</span>
          {fairs.length > 0 && <span><svg width="18" height="10"><line x1="0" y1="5" x2="18" y2="5" stroke="var(--brass)" strokeWidth="2" strokeDasharray="4 3" /></svg> Fair value</span>}
        </div>
      </div>
      <div className="sect" style={{ marginTop: 4 }}>เพิ่มราคาที่เห็น</div>
      <div className="padd">
        <div className="field" style={{ flex: 1.2 }}><label>วันที่</label><input type="date" value={nd} onChange={(e) => setNd(e.target.value)} /></div>
        <div className="field" style={{ flex: 1 }}><label>ราคา</label><input inputMode="decimal" value={np} onChange={(e) => setNp(e.target.value)} placeholder="เช่น 32.5" /></div>
        <button className="addbtn" disabled={!nd || np === ""} onClick={() => { onAdd(active, nd, np); setNp(""); }}>เพิ่ม</button>
      </div>
      {sortedManual.length > 0 && (
        <div className="plist">
          {sortedManual.map((x) => (

          ))}

      )}

}

function Chart({ linePts, markers, fairs }) {
  const W = 480, H = 220, padL = 42, padR = 14, padT = 14, padB = 26;
  if (linePts.length < 2) return <div className="chart-empty">ยังมีราคาน้อยเกินไป — เพิ่มราคาอย่างน้อย 2 จุด<br />แล้วเส้นเทรนด์จะขึ้นให้เห็น</div>;
  const allP = linePts.map((d) => d.p).concat(markers.map((m) => m.p)).concat(fairs);
  let minP = Math.min(...allP), maxP = Math.max(...allP);
  if (minP === maxP) { minP -= 1; maxP += 1; }
  const pad = (maxP - minP) * 0.08; minP -= pad; maxP += pad;
  const allT = linePts.map((d) => d.t).concat(markers.map((m) => m.t));
  let minT = Math.min(...allT), maxT = Math.max(...allT);
  if (minT === maxT) maxT = minT + 86400000;
  const x = (t) => padL + ((t - minT) / (maxT - minT)) * (W - padL - padR);
  const y = (p) => padT + (1 - (p - minP) / (maxP - minP)) * (H - padT - padB);
  const path = linePts.map((d, i) => (i ? "L" : "M") + x(d.t).toFixed(1) + " " + y(d.p).toFixed(1)).join(" ");
  const area = path + ` L ${x(linePts[linePts.length - 1].t).toFixed(1)} ${H - padB} L ${x(linePts[0].t).toFixed(1)} ${H - padB} Z`;
  const yt = [0, 0.5, 1].map((f) => minP + f * (maxP - minP));
  const fmt = (t) => { const d = new Date(t); return d.getDate() + "/" + (d.getMonth() + 1); };
  const dec = maxP < 50 ? 1 : 0;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
      {yt.map((v, i) => (
        <g key={i}>
          <line x1={padL} y1={y(v)} x2={W - padR} y2={y(v)} stroke="#EBEDE7" strokeWidth="1" />
          <text x={padL - 6} y={y(v) + 3} textAnchor="end" fontSize="10" fill="#9AA09A">{v.toFixed(dec)}</text>
        </g>
      ))}
      {fairs.map((f, i) => <line key={"f" + i} x1={padL} y1={y(f)} x2={W - padR} y2={y(f)} stroke="var(--brass)" strokeWidth="1.5" strokeDasharray="4 3" />)}
      <path d={area} fill="rgba(23,50,44,0.06)" />
      <path d={path} fill="none" stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      {linePts.map((d, i) => <circle key={"c" + i} cx={x(d.t)} cy={y(d.p)} r="2.4" fill="var(--ink)" />)}
      {markers.map((m, i) => {
        const cx = x(m.t), cy = y(m.p);
        return m.kind === "buy"
          ? <polygon key={"m" + i} points={`${cx},${cy - 8} ${cx + 6},${cy + 4} ${cx - 6},${cy + 4}`} fill="var(--green)" stroke="#fff" strokeWidth="1.2" />
          : <polygon key={"m" + i} points={`${cx - 6},${cy - 4} ${cx + 6},${cy - 4} ${cx},${cy + 8}`} fill="var(--red)" stroke="#fff" strokeWidth="1.2" />;
      })}
      <text x={padL} y={H - 8} fontSize="10" fill="#9AA09A">{fmt(linePts[0].t)}</text>
      <text x={W - padR} y={H - 8} textAnchor="end" fontSize="10" fill="#9AA09A">{fmt(linePts[linePts.length - 1].t)}</text>
    </svg>
  );
}

function CalendarView({ trades, ref0, setRef0, onOpen }) {
  const THMON = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
  const DOW = ["จ", "อ", "พ", "พฤ", "ศ", "ส", "อา"];
  const { y, m } = ref0;
  const iso = (yy, mm, dd) => `${yy}-${String(mm + 1).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;

  const sells = {}, buys = {};
  trades.forEach((t) => {
    if (t.sellDate && isClosed(t)) (sells[t.sellDate] = sells[t.sellDate] || []).push(t);
    if (t.entryDate) buys[t.entryDate] = (buys[t.entryDate] || 0) + 1;
  });

  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7;
  const dim = new Date(y, m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push({ other: true });
  for (let d = 1; d <= dim; d++) cells.push({ d, date: iso(y, m, d) });
  while (cells.length % 7 !== 0) cells.push({ other: true });

  const ym = iso(y, m, 1).slice(0, 7);
  const monthTrades = trades.filter((t) => t.sellDate && isClosed(t) && t.sellDate.slice(0, 7) === ym);
  const mWin = monthTrades.filter((t) => profit(t) > 0).length;
  const mRate = monthTrades.length ? Math.round((mWin / monthTrades.length) * 100) : null;
  const mAvg = monthTrades.length ? monthTrades.reduce((s, t) => s + profit(t), 0) / monthTrades.length : null;

  const shift = (delta) => { let nm = m + delta, ny = y; if (nm < 0) { nm = 11; ny--; } if (nm > 11) { nm = 0; ny++; } setRef0({ y: ny, m: nm }); };

  return (
    <div className="wrap slidein">
      <div className="loghead"><h2>ปฏิทินผลตอบแทน</h2><p>ผลรายวันจากวันที่ขาย — จับจังหวะและแพทเทิร์น</p></div>
      <div className="calcard">
        <div className="calhead">
          <h3>{THMON[m]} {y}</h3>
          <div className="navbtns">
            <button onClick={() => shift(-1)} aria-label="เดือนก่อน"><ArrowLeft size={16} /></button>
            <button onClick={() => shift(1)} aria-label="เดือนถัดไป" style={{ transform: "scaleX(-1)" }}><ArrowLeft size={16} /></button>
          </div>
        </div>
        <div className="dow">{DOW.map((d) => <span key={d}>{d}</span>)}</div>
        <div className="cal">
          {cells.map((c, i) => {
            if (c.other) return <div className="cell other" key={i} />;
            const dt = sells[c.date] || [];
            const has = dt.length > 0;
            const avg = has ? dt.reduce((s, t) => s + profit(t), 0) / dt.length : null;
            const cls = has ? (avg >= 0 ? "win" : "loss") : "";
            return (
              <div className={"cell " + cls} key={i} onClick={() => has && onOpen(dt[0])} style={{ cursor: has ? "pointer" : "default" }}>
                {buys[c.date] && <span className="edot" title="ซื้อวันนี้" />}
                <span className="dn">{c.d}</span>
                {has && <span className="rv">{dt.length > 1 ? dt.length + " ดีล" : pct(avg)}</span>}
              </div>
            );
          })}
        </div>
        <div className="callegend">
          <span><i className="sw" style={{ background: "#CFE1D7" }} /> กำไร</span>
          <span><i className="sw" style={{ background: "#E7CEC8" }} /> ขาดทุน</span>
          <span><i className="edot" style={{ position: "static" }} /> วันที่ซื้อ</span>
        </div>
      </div>

      <div className="sect" style={{ marginTop: 2 }}>สรุปเดือนนี้ (จากวันที่ขาย)</div>
      <div className="sgrid" style={{ gridTemplateColumns: "1fr 1fr 1fr" }}>
        <div className="stat"><div className="v">{monthTrades.length}</div><div className="l">ดีลที่ปิด</div></div>
        <div className="stat"><div className="v">{mRate == null ? "—" : mRate + "%"}</div><div className="l">Win rate</div></div>
        <div className="stat"><div className="v" style={{ color: mAvg == null ? "var(--ink)" : mAvg >= 0 ? "var(--green)" : "var(--red)" }}>{mAvg == null ? "—" : pct(mAvg)}</div><div className="l">เฉลี่ย/ดีล</div></div>
      </div>
      <div className="readout">เพราะคุณถือยาว ~3 เดือน วันที่มีสีคือ “วันที่ขาย” จุดทองคือ “วันที่ซื้อ” — ปฏิทินนี้เลยเหมาะดูจังหวะเข้า-ออก มากกว่าผลรายวันแบบเทรดสั้น</div>
    </div>
  );
}

              <span className="d" style={{ marginLeft: 8 }}>{Number(x.shares).toLocaleString()} × {x.price}</span>

function computeInsights(trades) {
  const closed = trades.filter(isClosed);
  const out = [];
  if (closed.length < 3) {
    out.push({ tone: "flat", title: "ยังมีข้อมูลน้อย", body: "กรอกดีลให้ครบสัก 5–8 ดีล ระบบจะเริ่มสรุป insight จากข้อมูลจริงของคุณ" });
    return out;
  }
  const avg = (arr) => (arr.length ? arr.reduce((s, t) => s + profit(t), 0) / arr.length : null);
  const onPlan = closed.filter((t) => !isFomo(t)), fomo = closed.filter(isFomo);
  if (onPlan.length >= 1 && fomo.length >= 1) {
    const a = avg(onPlan), b = avg(fomo);
    out.push({ tone: b < a ? "down" : "up", title: "วินัยเข้าคือคานงัดของคุณ",
      body: `ซื้อตามเป้าเฉลี่ย ${pct(a)} เทียบกับซื้อเกินเป้า (FOMO) ${pct(b)} — ต่างกัน ${pct(a - b)} จาก ${fomo.length} ดีลที่ไล่ราคา` });
  }
  const pr = trades.filter((t) => t.processLuck === "กระบวนการถูก").length;
  const jl = trades.filter((t) => (t.processLuck || "").startsWith("แค่โชค")).length;
  if (pr + jl > 0) {
    if (jl > pr) out.push({ tone: "down", title: "ยังพึ่งโชคมากกว่าฝีมือ", body: `ดีลที่ตัดสินว่า “แค่โชค” มี ${jl} เทียบกับ “กระบวนการถูก” ${pr} — เป้าหมายคือทำให้ฝีมือแซงโชค` });
    else out.push({ tone: "up", title: "กระบวนการเริ่มพิสูจน์ตัวเอง", body: `“กระบวนการถูก” ${pr} เทียบกับ “แค่โชค” ${jl} — เก็บดีลต่อไปให้ครบเพื่อยืนยัน edge` });
  }
  const byKey = (key) => { const m = {}; closed.forEach((t) => { const k = (t[key] || "").trim(); if (!k) return; (m[k] = m[k] || []).push(t); }); return m; };
  const best = (m) => { let bk = null, bv = -Infinity, bn = 0; Object.entries(m).forEach(([k, a]) => { if (a.length >= 2) { const v = avg(a); if (v > bv) { bv = v; bk = k; bn = a.length; } } }); return bk ? { k: bk, v: bv, n: bn } : null; };
  const bg = best(byKey("game")) || best(byKey("sector"));
  if (bg && bg.v > 0) out.push({ tone: "up", title: `“${bg.k}” คือ edge ของคุณ`, body: `ให้ผลเฉลี่ย ${pct(bg.v)} จาก ${bg.n} ดีล — โฟกัสแนวนี้ให้มากขึ้น` });
  const kr = closed.filter((t) => t.afterSell === "ขึ้นต่อ").length;
  if (kr >= 2) out.push({ tone: "down", title: "กฎ +30% อาจตัดกำไรของดี", body: `มี ${kr} ครั้งที่ขายแล้วราคายังขึ้นต่อ — ลองแยกกฎขายของหุ้นพื้นฐานดีออกจากหุ้นเล่นรอบ` });
  return out.slice(0, 4);
}

function Insights({ trades }) {
  const items = computeInsights(trades);
  return (
    <div className="card2 insights">
      <div className="c2head"><h3>Insights</h3> <span>จากข้อมูลของคุณ</span></div>
      {items.map((it, i) => (
        <div className="ins" key={i}>
          <span className={"insic " + it.tone}>{it.tone === "up" ? <TrendingUp size={16} /> : it.tone === "down" ? <TrendingDown size={16} /> : <AlertTriangle size={16} />}</span>
          <div><div className="inst">{it.title}</div><div className="insb">{it.body}</div></div>
        </div>
      ))}
    </div>
  );
}

function WinLoss({ trades }) {
  const closed = trades.filter(isClosed);
  if (closed.length === 0) return null;
  const wins = closed.filter((t) => profit(t) > 0), losses = closed.filter((t) => profit(t) <= 0);
  const wr = wins.length / closed.length;
  const avgW = wins.length ? wins.reduce((s, t) => s + profit(t), 0) / wins.length : null;
  const avgL = losses.length ? losses.reduce((s, t) => s + profit(t), 0) / losses.length : null;
  const payoff = (avgW != null && avgL != null && avgL !== 0) ? avgW / Math.abs(avgL) : null;
  const R = 52, C = 2 * Math.PI * R;
  return (
    <div className="card2">
      <div className="c2head"><h3>แพ้ / ชนะ</h3> <span>อัตราชนะและความสมมาตรของกำไร-ขาดทุน</span></div>
      <div className="wl">
        <svg viewBox="0 0 128 128" className="donut">
          <circle cx="64" cy="64" r={R} fill="none" stroke="#E3CBC6" strokeWidth="16" />
          <circle cx="64" cy="64" r={R} fill="none" stroke="var(--green)" strokeWidth="16" strokeLinecap="butt"
            strokeDasharray={`${(wr * C).toFixed(1)} ${C.toFixed(1)}`} transform="rotate(-90 64 64)" />
          <text x="64" y="60" textAnchor="middle" fontSize="26" fontWeight="700" fill="var(--ink)">{Math.round(wr * 100)}%</text>
          <text x="64" y="79" textAnchor="middle" fontSize="9.5" fill="var(--muted)">WIN RATE</text>
        </svg>
        <div className="wlside">
          <div className="wlrow"><span><i className="d g" />ชนะ</span><b>{wins.length}</b></div>
          <div className="wlrow"><span><i className="d r" />แพ้</span><b>{losses.length}</b></div>
          <div className="wlbar"><span>กำไรเฉลี่ย</span><b className="pos">{avgW == null ? "—" : pct(avgW)}</b></div>
          <div className="wlbar"><span>ขาดทุนเฉลี่ย</span><b className="neg">{avgL == null ? "—" : pct(avgL)}</b></div>
          <div className="wlpay">Payoff <b>{payoff == null ? "—" : payoff.toFixed(2) + "×"}</b></div>
        </div>
      </div>
    </div>
  );
}

function Breakdown({ trades, onFilter }) {
  const [dim, setDim] = useState("ticker");
  const [unit, setUnit] = useState("pct");
  const closed = trades.filter(isClosed);
  if (closed.length === 0) return null;
  const label = { ticker: "หุ้น", game: "เกม", sector: "กลุ่ม" };
  const useBaht = unit === "baht";
  const src = useBaht ? closed.filter((t) => lotAgg(t.lots).realized != null) : closed;
  const m = {};
  src.forEach((t) => { const k = (t[dim] || "").trim() || "(ไม่ระบุ)"; (m[k] = m[k] || []).push(t); });
  const rows = Object.entries(m).map(([k, a]) => ({
    k, n: a.length,
    v: useBaht ? a.reduce((s, t) => s + lotAgg(t.lots).realized, 0) : a.reduce((s, t) => s + profit(t), 0) / a.length,
  })).sort((x, y) => y.v - x.v);
  const maxAbs = Math.max(0.0001, ...rows.map((r) => Math.abs(r.v)));
  const fmtVal = (v) => (useBaht ? baht(v) : pct(v));
  return (
    <div className="card2">
      <div className="c2head"><h3>ผลตอบแทนแยกหมวด</h3> <span>{useBaht ? "กำไรรวมเป็นบาท" : "เฉลี่ย % ต่อดีล"} — แตะแถวเพื่อกรอง</span></div>
      <div className="bdtoggles">
        <div className="seg">
          {["ticker", "game", "sector"].map((d) => <button key={d} className={dim === d ? "on" : ""} onClick={() => setDim(d)}>{label[d]}</button>)}
        </div>
        <div className="seg">
          <button className={unit === "pct" ? "on" : ""} onClick={() => setUnit("pct")}>%</button>
          <button className={unit === "baht" ? "on" : ""} onClick={() => setUnit("baht")}>บาท</button>
        </div>
      </div>
      {rows.length === 0 ? (
        <div style={{ padding: "18px 4px", color: "var(--muted)", fontSize: 13.5, textAlign: "center", lineHeight: 1.5 }}>
          ยังไม่มีข้อมูลบาท — ลงจำนวนหุ้นในรายการซื้อ-ขายของแต่ละดีลก่อน
        </div>
      ) : (
        <div className="bd">
          {rows.map((r) => (
            <div className="bdrow" key={r.k} onClick={() => onFilter(r.k)}>
              <span className="bdk">{r.k}</span>
              <span className="bdbar">
                <i className="mid" />
                <i className={"bdfill " + (r.v >= 0 ? "pos" : "neg")} style={r.v >= 0 ? { left: "50%", width: (Math.abs(r.v) / maxAbs * 50) + "%" } : { right: "50%", width: (Math.abs(r.v) / maxAbs * 50) + "%" }} />
              </span>
              <span className={"bdv " + (r.v >= 0 ? "pos" : "neg")}>{fmtVal(r.v)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

        <div className="two">
          <Field label="วันที่เข้า"><input type="date" value={draft.entryDate} onChange={set("entryDate")} /></Field>
          <Field label="ชื่อหุ้น"><input value={draft.ticker} onChange={set("ticker")} placeholder="เช่น KTB" /></Field>
        </div>
        <Field label="กลุ่ม"><input value={draft.sector} onChange={set("sector")} placeholder="เช่น ธนาคาร" /></Field>
        <Field label="เกมที่เล่น"><Sel value={draft.game} onChange={set("game")} opts={OPTIONS.game} /></Field>
        <Field label="Thesis หลัก — ทำไมถึงซื้อ"><textarea value={draft.thesis} onChange={set("thesis")} /></Field>
        <Field label="หลักฐานว่า “ถูก” (P/BV, P/E, Yield เทียบกลุ่ม)"><textarea value={draft.cheapEvidence} onChange={set("cheapEvidence")} /></Field>
        <Field label="ถูกเพราะมองข้าม หรือ พื้นฐานด้อย?"><Sel value={draft.cheapReason} onChange={set("cheapReason")} opts={OPTIONS.cheapReason} /></Field>
        <div className="two">
          <Field label="Fair value ที่ประเมิน"><input inputMode="decimal" value={draft.fairValue} onChange={set("fairValue")} /></Field>
          <Field label="ราคาที่ตั้งใจเข้า"><input inputMode="decimal" value={draft.targetEntry} onChange={set("targetEntry")} /></Field>
        </div>
        <Field label="ราคาเข้าจริง (หรือใช้รายการซื้อ-ขายด้านล่าง)"><input inputMode="decimal" value={draft.actualEntry} onChange={set("actualEntry")} /></Field>
        {fomo && <div className="banner"><AlertTriangle size={16} /> ซื้อสูงกว่าราคาเป้า — ระวัง FOMO</div>}
        <Field label="เงื่อนไขขาย (Exit rules)"><textarea value={draft.exitRules} onChange={set("exitRules")} /></Field>
        <Field label="สภาพตลาด / ธีมตอนเข้า"><textarea value={draft.marketContext} onChange={set("marketContext")} /></Field>

        <div className="sect">รายการซื้อ-ขาย · จำนวนหุ้น</div>
        <LotLedger lots={draft.lots} onChange={(lots) => setDraft({ ...draft, lots })} />

        <div className="sect">หลังออก · เติมหลังขายจบ</div>
        <div className="two">
          <Field label="วันที่ขาย"><input type="date" value={draft.sellDate} onChange={set("sellDate")} /></Field>
          <Field label="ราคาขาย (หรือใช้รายการซื้อ-ขาย)"><input inputMode="decimal" value={draft.sellPrice} onChange={set("sellPrice")} /></Field>
        </div>
        {(p != null || hd != null) && (
          <div className="live">
            <div><div className="l">กำไร/ขาดทุน</div><div className="v" style={{ color: p == null ? "var(--ink)" : p >= 0 ? "var(--green)" : "var(--red)" }}>{p == null ? "—" : pct(p)}</div></div>
            <div><div className="l">ระยะถือ</div><div className="v">{hd == null ? "—" : hd + " วัน"}</div></div>
          </div>
        )}
        <Field label="ขายเพราะอะไร"><Sel value={draft.sellReason} onChange={set("sellReason")} opts={OPTIONS.sellReason} /></Field>
        <Field label="ราคาขึ้นเพราะเหตุที่คาดไหม?"><Sel value={draft.rose} onChange={set("rose")} opts={OPTIONS.rose} /></Field>
        <Field label="หลังขายราคาไปทางไหน"><Sel value={draft.afterSell} onChange={set("afterSell")} opts={OPTIONS.afterSell} /></Field>
        <Field label="กระบวนการถูก หรือ แค่โชค?"><Sel value={draft.processLuck} onChange={set("processLuck")} opts={OPTIONS.processLuck} /></Field>
        <Field label="บทเรียน"><textarea value={draft.lesson} onChange={set("lesson")} /></Field>

        <div className="btns">
          {exists && <button className="btn btn-danger" onClick={onDelete} aria-label="ลบดีล"><Trash2 size={18} /></button>}
          <button className="btn btn-ghost" onClick={onCancel}>ยกเลิก</button>
          <button className="btn btn-primary" onClick={onSave}>บันทึก</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
